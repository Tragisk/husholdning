<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Husholdning – overblik</title>
<meta name="theme-color" content="#7b1e34">
<link rel="icon" href="../icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<style>
  :root {
    --bg: #f4f5f2; --card: #ffffff; --text: #1c2119; --muted: #646b60; --line: #e2e5de;
    --over-bg: #fbe4e2; --over-line: #8b1a1a; --accent: #7b1e34;
    --sat-bg: 70%; --light-bg: 94%; --sat-line: 62%; --light-line: 40%;
    --shadow: 0 1px 2px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121410; --card: #1b1e19; --text: #e7eae3; --muted: #9ba294; --line: #2c3029;
      --over-bg: #3a1714; --over-line: #e0574d; --accent: #d98ca0;
      --sat-bg: 35%; --light-bg: 16%; --sat-line: 55%; --light-line: 50%;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text); }
  body { font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .wrap { max-width: 560px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(84px + env(safe-area-inset-bottom)); }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 28px; margin: 0; letter-spacing: -.5px; }
  .dato { color: var(--muted); font-size: 14px; }
  .opsummering { color: var(--muted); font-size: 14px; margin: 4px 0 16px; min-height: 20px; }
  .opsummering b { color: var(--text); }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 24px 4px 8px; font-weight: 600; }
  .liste { display: flex; flex-direction: column; gap: 8px; }
  .kort { --h: 120; background: hsl(var(--h) var(--sat-bg) var(--light-bg));
    border-left: 6px solid hsl(var(--h) var(--sat-line) var(--light-line));
    border-radius: 12px; box-shadow: var(--shadow); padding: 11px 14px; }
  .kort.over { background: var(--over-bg); border-left-color: var(--over-line); }
  .navn { font-weight: 650; font-size: 17px; overflow-wrap: anywhere; }
  .status { font-size: 14px; margin-top: 2px; font-weight: 550; color: hsl(var(--h) var(--sat-line) calc(var(--light-line) - 8%)); }
  @media (prefers-color-scheme: dark) { .status { color: hsl(var(--h) var(--sat-line) 65%); } }
  .kort.over .status { color: var(--over-line); }
  .meta { font-size: 13px; color: var(--muted); margin-top: 1px; }
  .daglig { background: var(--card); border-radius: 12px; padding: 4px 14px; box-shadow: var(--shadow); }
  .daglig div { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .daglig div:last-child { border-bottom: 0; }
  .fod { color: var(--muted); font-size: 12px; text-align: center; margin-top: 24px; }
  .fejl { color: var(--over-line); text-align: center; padding: 24px 0; }
  .tom { color: var(--muted); text-align: center; padding: 24px 0; }

  /* Projekter: kompakte rækker */
  .liste.p { gap: 4px; }
  .pkort { display: flex; align-items: center; gap: 8px; min-height: 34px; padding: 6px 10px; background: var(--card);
    border-left: 4px solid var(--accent); border-radius: 8px; box-shadow: var(--shadow); }
  .pkort.klar { border-left-color: var(--line); }
  .pnavn { flex: 1; min-width: 0; font-size: 15px; font-weight: 600; line-height: 1.25; overflow-wrap: anywhere; }
  .pkort.klar .pnavn { text-decoration: line-through; color: var(--muted); }
  .pmeta { flex: none; font-size: 12px; color: var(--muted); white-space: nowrap; }

  /* Fane-bar */
  nav.faner { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.faner button { flex: 1; max-width: 280px; background: none; border: 0; padding: 10px 0 12px; color: var(--muted);
    display: flex; flex-direction: column; align-items: center; gap: 2px; font: inherit; font-size: 12px; cursor: pointer; }
  nav.faner button svg { width: 24px; height: 24px; }
  nav.faner button.aktiv { color: var(--accent); font-weight: 600; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 id="titel">Husholdning</h1>
    <span class="dato" id="idag"></span>
  </header>
  <section id="vOpgaver">
  <p class="opsummering" id="opsummering">Henter …</p>
  <div class="liste" id="liste"></div>
  <div id="dagligBoks" style="display:none">
    <h2>Dagligt</h2>
    <div class="daglig" id="dagligListe"></div>
  </div>
  </section>

  <section id="vProjekter" hidden>
    <p class="opsummering" id="pOpsum">Henter …</p>
    <div id="pIndhold"></div>
  </section>

  <p class="fod" id="fod">Kun visning · opdateres automatisk</p>
</div>

<nav class="faner">
  <button id="tOpgaver" class="aktiv" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>
    Opgaver
  </button>
  <button id="tProjekter" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
    Projekter
  </button>
</nav>

<script>
const SB_URL = "https://jmkicrzqmzbetzzjoqtd.supabase.co";
const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Impta2ljcnpxbXpiZXR6empvcXRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTI1MzY1NDUsImV4cCI6MjEwODExMjU0NX0.BHSSKBFBVZ0qESq-LFkUccpCFRsbhq50DQi4bxK6jx4";
const FREK_TEKST = { daglig: "Dagligt", "2dage": "Hver 2. dag", ugentlig: "Ugentligt", "14dage": "Hver 14. dag",
  maanedlig: "Månedligt", kvartal: "Kvartalsvis", halvaar: "Halvårligt", aarlig: "Årligt", engang: "Påmindelse" };
const MDR = ["jan.", "feb.", "mar.", "apr.", "maj", "jun.", "jul.", "aug.", "sep.", "okt.", "nov.", "dec."];
const $ = (id) => document.getElementById(id);

function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function idagISO() {
  const d = new Date();
  return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}
function fmtDato(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-").map(Number);
  return `${d}. ${MDR[m - 1]}` + (y !== new Date().getFullYear() ? ` ${y}` : "");
}
function dageTekst(n) { return n === 1 ? "1 dag" : `${n} dage`; }
function dageMellem(a, b) { return Math.round((Date.parse(b + "T00:00:00Z") - Date.parse(a + "T00:00:00Z")) / 86400000); }

function vurder(o) {
  const d = o.dage_til_forfald;
  if (o.frekvens === "engang") {
    const til = dageMellem(idagISO(), o.frist);
    const status = til < 0 ? `Datoen var ${fmtDato(o.frist)}` : til === 0 ? "Det er i dag"
      : til === 1 ? `I morgen · ${fmtDato(o.frist)}` : `Om ${dageTekst(til)} · ${fmtDato(o.frist)}`;
    if (d <= 0) return { over: true, hue: 0, status };
    const f = Math.min(1, Math.max(0, 1 - d / Math.max(1, o.interval_dage)));
    return { over: false, hue: Math.round(120 * (1 - f)), status };
  }
  if (o.sidste_dato == null) return { over: true, hue: 0, status: "Ikke registreret endnu" };
  if (d < 0) return { over: true, hue: 0, status: `Overskredet ${dageTekst(-d)}` };
  const f = Math.min(1, Math.max(0, 1 - d / Math.max(1, o.interval_dage)));
  const status = d === 0 ? "Forfalder i dag" : d === 1 ? "Forfalder i morgen" : `Forfalder om ${dageTekst(d)} · ${fmtDato(o.forfald)}`;
  return { over: false, hue: Math.round(120 * (1 - f)), status };
}
function erOver(o) {
  return o.frekvens === "engang" ? o.dage_til_forfald <= 0 : (o.sidste_dato == null || o.dage_til_forfald < 0);
}
function meta(o) {
  if (o.frekvens === "engang") return "Påmindelse";
  return [FREK_TEKST[o.frekvens], o.sidste_dato ? `Sidst ${fmtDato(o.sidste_dato)}` : null].filter(Boolean).join(" · ");
}

async function hent() {
  $("idag").textContent = fmtDato(idagISO());
  hentProjekter();
  try {
    const res = await fetch(`${SB_URL}/rest/v1/rpc/pligt_overblik`, {
      method: "POST",
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
      body: "{}",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    tegn(await res.json());
    $("fod").textContent = `Kun visning · opdateret ${new Date().toLocaleTimeString("da-DK", { hour: "2-digit", minute: "2-digit" })}`;
  } catch (e) {
    $("liste").innerHTML = '<div class="fejl">Kunne ikke hente overblikket lige nu.</div>';
    $("opsummering").textContent = "";
  }
}

function tegn(rows) {
  const liste = rows.filter((o) => o.frekvens !== "daglig")
    .sort((a, b) => (a.dage_til_forfald ?? -1e9) - (b.dage_til_forfald ?? -1e9) || a.navn.localeCompare(b.navn, "da"));
  const daglig = rows.filter((o) => o.frekvens === "daglig")
    .sort((a, b) => a.sortering - b.sortering || a.navn.localeCompare(b.navn, "da"));

  const over = liste.filter(erOver).length;
  const snart = liste.filter((o) => o.frekvens !== "engang" && !erOver(o) && o.dage_til_forfald <= o.varsel_dage).length;
  $("opsummering").innerHTML = over || snart
    ? [over ? `<b>${over}</b> skal gøres nu` : "", snart ? `<b>${snart}</b> forfalder snart` : ""].filter(Boolean).join(" · ")
    : "Alt er under kontrol 🌿";

  $("liste").innerHTML = liste.map((o) => {
    const v = vurder(o);
    return `<div class="kort${v.over ? " over" : ""}" style="--h:${v.hue}">
      <div class="navn">${esc(o.navn)}</div>
      <div class="status">${esc(v.status)}</div>
      <div class="meta">${esc(meta(o))}</div>
    </div>`;
  }).join("");

  $("dagligBoks").style.display = daglig.length ? "" : "none";
  $("dagligListe").innerHTML = daglig.map((o) => `<div>${esc(o.navn)}</div>`).join("");
}

/* ---------- projekter (kun visning) ---------- */
async function hentProjekter() {
  try {
    const res = await fetch(`${SB_URL}/rest/v1/rpc/pligt_projekter_overblik`, {
      method: "POST",
      headers: { apikey: SB_KEY, Authorization: `Bearer ${SB_KEY}`, "Content-Type": "application/json" },
      body: "{}",
    });
    if (!res.ok) throw new Error("HTTP " + res.status);
    tegnProjekter(await res.json());
  } catch (e) {
    $("pIndhold").innerHTML = '<div class="fejl">Kunne ikke hente projekterne lige nu.</div>';
    $("pOpsum").textContent = "";
  }
}

function tegnProjekter(rows) {
  const aabne = rows.filter((p) => !p.faerdig)
    .sort((a, b) => a.sortering - b.sortering || a.navn.localeCompare(b.navn, "da"));
  const faerdige = rows.filter((p) => p.faerdig)
    .sort((a, b) => b.faerdig.localeCompare(a.faerdig) || a.navn.localeCompare(b.navn, "da"));
  $("pOpsum").innerHTML = rows.length
    ? `<b>${aabne.length}</b> åbne` + (faerdige.length ? ` · <b>${faerdige.length}</b> færdige` : "")
    : "Ingen projekter endnu";

  const raekke = (p) => `<div class="pkort${p.faerdig ? " klar" : ""}"><span class="pnavn">${esc(p.navn)}</span>`
    + `<span class="pmeta">${esc(p.faerdig ? "Færdig " + fmtDato(p.faerdig) : fmtDato(p.oprettet))}</span></div>`;

  // Kategorierne vises i den rækkefølge, de først optræder (listen er sorteret efter "sortering")
  const grupper = new Map();
  aabne.forEach((p) => {
    if (!grupper.has(p.kategori)) grupper.set(p.kategori, []);
    grupper.get(p.kategori).push(p);
  });
  let html = aabne.length
    ? [...grupper].map(([k, liste]) => `<h2>${esc(k)}</h2><div class="liste p">${liste.map(raekke).join("")}</div>`).join("")
    : '<div class="tom">Ingen åbne projekter.</div>';
  if (faerdige.length) html += `<h2>Færdige</h2><div class="liste p">${faerdige.map(raekke).join("")}</div>`;
  $("pIndhold").innerHTML = html;
}

/* ---------- faner ---------- */
function visFane(navn) {
  const projekt = navn === "projekter";
  $("vOpgaver").hidden = projekt;
  $("vProjekter").hidden = !projekt;
  $("tOpgaver").classList.toggle("aktiv", !projekt);
  $("tProjekter").classList.toggle("aktiv", projekt);
  $("titel").textContent = projekt ? "Projekter" : "Husholdning";
  window.scrollTo(0, 0);
}
$("tOpgaver").onclick = () => visFane("opgaver");
$("tProjekter").onclick = () => visFane("projekter");

hent();
setInterval(hent, 5 * 60 * 1000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") hent(); });
</script>
</body>
</html>
